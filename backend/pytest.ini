[pytest]
# 测试文件放在 tests 目录,文件名以 test_ 开头
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出选项:-v 显示每个用例名,--tb=short 精简错误堆栈
addopts = -v --tb=short

# 不把程序运行日志混在测试输出里(否则中文日志在 Windows 控制台会显示成乱码)
log_cli = false
# 忽略第三方库的过时提醒(与本项目代码无关,不干扰读结果)
filterwarnings =
    ignore::DeprecationWarning
